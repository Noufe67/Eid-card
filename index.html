<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>معايدة</title>

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family: sans-serif;
    }

    body{
      background:#1f2559;
      display:flex;
      justify-content:center;
      align-items:center;
      min-height:100vh;
      flex-direction:column;
      gap:20px;
      padding:20px;
    }

    .card{
      width:350px;
      height:620px;
      background-image:url('YOUR-IMAGE.jpg');
      background-size:cover;
      background-position:center;
      border-radius:25px;
      position:relative;
      overflow:hidden;
      box-shadow:0 10px 30px rgba(0,0,0,.3);
    }

    .name{
      position:absolute;
      top:52%;
      left:50%;
      transform:translate(-50%,-50%);
      color:white;
      font-size:32px;
      font-weight:bold;
      text-shadow:0 2px 10px rgba(0,0,0,.4);
      width:90%;
      text-align:center;
    }

    input{
      width:350px;
      padding:15px;
      border:none;
      border-radius:15px;
      outline:none;
      font-size:18px;
      text-align:center;
    }

    button{
      width:350px;
      padding:15px;
      border:none;
      border-radius:15px;
      background:#5d6cf5;
      color:white;
      font-size:18px;
      cursor:pointer;
    }
  </style>
</head>

<body>

  <div class="card">
    <div class="name" id="userName">
      اسمك هنا
    </div>
  </div>

  <input type="text" placeholder="اكتب اسمك" oninput="changeName(this.value)">

  <button onclick="downloadCard()">
    تحميل المعايدة
  </button>

  <script>
    function changeName(value){
      document.getElementById("userName").innerText = value;
    }

    function downloadCard(){
      alert("ميزة التحميل تحتاج html2canvas");
    }
  </script>

</body>
</html>
