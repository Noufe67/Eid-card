<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>معايدة</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:sans-serif;
}

body{
background:#121a5c;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
min-height:100vh;
gap:20px;
padding:20px;
}

.card{
width:420px;
height:420px;
background-image:url('card.jpeg');
background-size:cover;
background-position:center;
border-radius:30px;
overflow:hidden;
position:relative;
box-shadow:0 15px 35px rgba(0,0,0,.35);
}

.name{
position:absolute;
bottom:55px;
left:35px;
color:white;
font-size:32px;
font-weight:bold;
text-shadow:0 2px 10px rgba(0,0,0,.4);
}

input{
width:420px;
padding:18px;
border:none;
border-radius:18px;
outline:none;
font-size:20px;
text-align:center;
}

button{
width:420px;
padding:18px;
border:none;
border-radius:18px;
background:#4d5dff;
color:white;
font-size:22px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="card">

<div class="name" id="userName">
اسمك هنا
</div>

</div>

<input
type="text"
placeholder="اكتب اسمك"
oninput="changeName(this.value)"
>

<button onclick="downloadCard()">
تحميل المعايدة
</button>

<script>

function changeName(value){
document.getElementById("userName").innerText = value;
}

function downloadCard(){
alert("اضغط مطول على الصورة واحفظها 🤍");
}

</script>
