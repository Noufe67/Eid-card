<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>معايدة</title>

<style>

*{

margin:0;

padding:0;

box-sizing:border-box;

font-family:sans-serif;

}

body{

background:#1e2559;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

min-height:100vh;

gap:20px;

padding:20px;

}

/* الكرت */

.card{

width:420px;

height:420px;

background-image:url('card.jpeg');

background-size:cover;

background-position:center;

border-radius:30px;

overflow:hidden;

position:relative;

box-shadow:0 10px 30px rgba(0,0,0,.3);

}

/* الاسم */

.name{

position:absolute;

bottom:55px;

left:35px;

color:white;

font-size:34px;

font-weight:bold;

text-shadow:0 2px 10px rgba(0,0,0,.4);

}

/* الانبوت */

input{

width:420px;

padding:15px;

border:none;

border-radius:15px;

font-size:18px;

outline:none;

text-align:center;

}

/* الزر */

button{

width:420px;

padding:15px;

border:none;

border-radius:15px;

background:#5d6cf5;

color:white;

font-size:18px;

cursor:pointer;

}

</style>

</head>

<body>

<div class="card">

<div class="name" id="userName">

اسمك هنا

</div>

</div>

<input

type="text"

placeholder="اكتب اسمك"

oninput="changeName(this.value)"

>

<button onclick="downloadCard()">

تحميل المعايدة

</button>

<script>

function changeName(value){

document.getElementById("userName").innerText = value;

}

function downloadCard(){

alert("اضغطي مطول على الصورة واحفظيها 🤍");

}

</script>

</body>

</html>
