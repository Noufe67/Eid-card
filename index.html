<!DOCTYPE html>

<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>معايدة</title>

<script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>

<style>

*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif;}

body{

background:#1e2559;

display:flex;

justify-content:center;

align-items:center;

flex-direction:column;

min-height:100vh;

gap:20px;

padding:20px;

}

.card{

width:420px;

height:420px;

background-image:url('card.jpeg');

background-size:cover;

background-position:center;

border-radius:30px;

overflow:hidden;

position:relative;

box-shadow:0 10px 30px rgba(0,0,0,.3);

}

.name{

position:absolute;

bottom:55px;

left:35px;

color:white;

font-size:34px;

font-weight:bold;

text-shadow:0 2px 10px rgba(0,0,0,.4);

}

input,button{

width:420px;

padding:15px;

border:none;

border-radius:15px;

font-size:18px;

text-align:center;

}

button{

background:#5d6cf5;

color:white;

cursor:pointer;

}

</style>

</head>

<body>

<div class="card" id="card">

<div class="name" id="userName">اسمك هنا</div>

</div>

<input type="text" placeholder="اكتب اسمك" oninput="changeName(this.value)">

<button onclick="downloadCard()">تحميل المعايدة</button>

<script>

function changeName(value){

document.getElementById("userName").innerText = value || "اسمك هنا";

}

function downloadCard(){

html2canvas(document.getElementById("card"),{

scale:5

}).then(canvas => {

let link = document.createElement("a");

link.download = "eid-card.png";

link.href = canvas.toDataURL("image/png");

link.click();

});

}

</script>

</body>

</html>
